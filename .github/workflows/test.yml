name: test

# Runs the offline checks (tests/run.sh) on every push and pull request, so a
# broken change is caught before a release tag exists.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 (the router's Lua version)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Run all offline checks
        run: sh tests/run.sh
