name: build-feed

# Aggregates each ax10-* package's own .ipk (published to its repo's "ipk" release) into
# the opkg feed the router consumes, and publishes it — plus the boot bootstrap assets —
# as a GitHub Release:
#   src/gz ax10 https://github.com/lee-soft/archer-ax10/releases/latest/download
#
# Trigger by pushing a version tag, e.g.  git tag v4 && git push origin v4
# (Make sure each package's build-ipk workflow has published its .ipk first.)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish the feed to'
        required: true
        default: 'feed-latest'

permissions:
  contents: write

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (bootstrap seeds live in this repo; payloads come from releases)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Collect each package's .ipk from its repo's "ipk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p feed
          for p in ax10-svc ax10-busybox ax10-dropbear ax10-wifi ax10-luci ax10-debloat; do
            echo "== $p =="
            gh release download ipk --repo lee-soft/$p --pattern '*.ipk' --dir feed
          done
          ls -l feed

      - name: Adapt LuCI client rates to the stock AX10 iwinfo schema
        run: |
          python3 scripts/patch_luci_rates.py --feed feed
          mkdir -p check-luci
          python3 - <<'PY'
          import io, pathlib, tarfile
          package = next(pathlib.Path('feed').glob('ax10-luci_*.ipk'))
          with tarfile.open(package) as outer:
              payload = outer.extractfile('./data.tar.gz').read()
          with tarfile.open(fileobj=io.BytesIO(payload)) as data:
              dist = data.extractfile('./opt/ax10-luci/luci-dist.tar.gz').read()
          with tarfile.open(fileobj=io.BytesIO(dist)) as web:
              for relative in ('network.js', 'view/status/include/60_wifi.js', 'view/network/wireless.js'):
                  content = web.extractfile('./www/luci-static/resources/' + relative).read()
                  target = pathlib.Path('check-luci') / relative
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
          PY
          node tests/luci-rates.cjs check-luci

      - name: Build the Packages index
        run: sh index.sh feed

      - name: Assemble release assets (feed + boot bootstrap)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          cp feed/*.ipk feed/Packages feed/Packages.gz dist/
          # Mirror the upstream payload in our release so all runtime downloads
          # use the owner's repository. Our installer sets that same feed URL.
          gh release download payload --repo lee-soft/ax10-opkg \
            --pattern 'opt.tar.gz' --pattern 'busybox-armv7l' --dir dist
          cp bootstrap/dropbear_vanilla dist/
          cp boot.sh install.sh dist/
          (cd dist && sha256sum * > manifest.sha256)
          ls -l dist

      - name: Publish feed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --title "$TAG" \
            --notes "ax10 opkg feed (aggregated per-package .ipks) + boot bootstrap assets" \
          || gh release upload "$TAG" dist/* --clobber
