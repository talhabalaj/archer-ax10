<div view="{iotNetworkView}"><div widget="panel" title-label="{IOT_NETWORK.TITLE}" collapsible="{false}" instruction="{IOT_NETWORK.INSTRUCTION}"><div widget="checkbox" id="iot-network-enable" class="block-title" data-bind="{iotNetworkModel.enable}" label-field="{IOT_NETWORK.TITLE}" box-label="{IOT_NETWORK.ENABLE}" true-value="on" false-value="off"></div><div widget="fieldset" id="iot-network-fields" data-bind="{iotNetworkFields}"><div widget="textbox" class="l-inline-block" data-bind="{iotNetworkModel.ssid}" label-field="{IOT_NETWORK.SSID}"></div><div widget="checkbox" class="l-inline-block after-input hidden-ssid" data-bind="{iotNetworkModel.hidden}" box-label="{IOT_NETWORK.HIDE_SSID}" true-value="on" false-value="off"></div><div widget="password" data-bind="{iotNetworkModel.password}" label-field="{IOT_NETWORK.PASSWORD}"></div><div widget="displaylabel" data-bind="{iotNetworkModel.gateway}" label-field="{IOT_NETWORK.GATEWAY}"></div><div widget="textbox" data-bind="{iotNetworkModel.allowLan}" label-field="{IOT_NETWORK.ALLOW_LAN}" tips="{IOT_NETWORK.ALLOW_LAN_TIPS}"></div></div></div><div widget="panel" title-label="{IOT_NETWORK.DEVICES}" collapsible="{false}" instruction="{IOT_NETWORK.DEVICES_INSTRUCTION}"><div widget="grid" data-bind="{iotClientStore}" id="iot-client-grid" class="m-card-grid" plugins="tBar|paging" operation="refresh"></div></div></div>
