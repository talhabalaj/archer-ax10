<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131816" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2312181c'/%3E%3Cpath d='M8 21.5a11 11 0 0 1 16 0M11 17.8a6.5 6.5 0 0 1 10 0' stroke='%232dd4bf' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='24' r='1.9' fill='%232dd4bf'/%3E%3C/svg%3E">
<title>Talha's network</title>
<!-- Dashboard for the Archer AX10, served at / by `ax10.sh ui` (bind mount over /www/index.html).
     Talks to the same encrypted LuCI API as the stock UI, with the stock encryption scripts,
     and shares its login (token + keys in localStorage), so "Full settings" opens logged in. -->
<style>
/* Tokens. Light by default ("router chassis"), dark follows the system. Each network keeps one
   hue everywhere: home green, guest amber, IoT violet. */
:root {
  --ground: #f2f4f1; --panel: #ffffff; --panel-2: #f7f8f6; --sunk: #eceeea;
  --ink: #17201c; --ink-2: #57635d; --ink-3: #87918c;
  --line: #e1e5e1; --line-2: #cfd5d0;
  --signal: #0b7a5c; --signal-ink: #ffffff; --signal-soft: #e3f2ec;
  --home: #0b7a5c; --guest: #a35f00; --iot: #5848c2;
  --guest-soft: #fbf0de; --iot-soft: #ecebfb;
  --warn: #a35f00; --warn-soft: #fbf0de;
  --bad: #b3261e; --bad-soft: #fbe9e7;
  --shadow: 0 1px 2px rgba(23, 32, 28, .05), 0 1px 0 rgba(23, 32, 28, .03);
  --pop: 0 12px 32px rgba(23, 32, 28, .16);
  --r: 12px; --r-sm: 8px;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --font: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: var(--font);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #131816; --panel: #1a201d; --panel-2: #1f2622; --sunk: #161b19;
    --ink: #e6ebe8; --ink-2: #9aa59f; --ink-3: #6c7772;
    --line: #29302c; --line-2: #36403b;
    --signal: #3cc99a; --signal-ink: #06231a; --signal-soft: rgba(60, 201, 154, .13);
    --home: #3cc99a; --guest: #e7a33e; --iot: #9d92f2;
    --guest-soft: rgba(231, 163, 62, .14); --iot-soft: rgba(157, 146, 242, .15);
    --warn: #e7a33e; --warn-soft: rgba(231, 163, 62, .14);
    --bad: #f0857c; --bad-soft: rgba(240, 133, 124, .13);
    --shadow: none; --pop: 0 16px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 400 14.5px/1.5 var(--font); -webkit-font-smoothing: antialiased; font-feature-settings: "tnum" 1; }
body { min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--signal); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }
svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.hidden { display: none !important; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: .01em; }
.muted { color: var(--ink-2); }

/* ---- shell: sidebar + content ---- */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100vh; background: linear-gradient(to right, var(--panel-2) 235px, var(--line) 235px 236px, transparent 236px); }
.side { position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; gap: 4px; padding: 20px 14px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; font-weight: 700; font-size: 16.5px; letter-spacing: -.015em; }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--ink); color: var(--panel); display: grid; place-items: center; }
.brand .mark svg { width: 17px; height: 17px; stroke-width: 2.2; }
.brand small { display: block; font-weight: 450; font-size: 12px; color: var(--ink-3); letter-spacing: 0; margin-top: -2px; }
nav.tabs { display: flex; flex-direction: column; gap: 2px; }
nav.tabs button { display: flex; align-items: center; gap: 11px; border: 0; background: none; color: var(--ink-2); padding: 9px 10px; border-radius: 8px; font-weight: 500; font-size: 14px; text-align: left; transition: transform 160ms var(--ease-out); }
nav.tabs button:hover { color: var(--ink); background: var(--sunk); }
nav.tabs button[aria-current="page"] { color: var(--ink); background: var(--panel); box-shadow: inset 0 0 0 1px var(--line), var(--shadow); font-weight: 600; }
nav.tabs button[aria-current="page"] svg { color: var(--signal); }
.spacer { flex: 1; }
.sidestat { padding: 12px 10px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-2); display: grid; gap: 2px; }
.sidestat b { color: var(--ink); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.sidestat .sub { font-size: 12.5px; color: var(--ink-3); }
.sideacts { display: flex; gap: 4px; padding: 4px 6px 0; }
.iconbtn { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 8px; border: 0; background: none; color: var(--ink-2); transition: transform 160ms var(--ease-out), background-color 120ms ease, color 120ms ease; }
.iconbtn:hover { background: var(--sunk); color: var(--ink); }
.menu { position: relative; }
.menu-pop { position: absolute; left: 0; bottom: 42px; min-width: 220px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; box-shadow: var(--pop); z-index: 40; transform-origin: bottom left; animation: pop 150ms var(--ease-out); }
@keyframes pop { from { opacity: 0; transform: scale(0.96); } }
.menu-pop button, .menu-pop a { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border: 0; background: none; color: var(--ink); border-radius: 6px; font-size: 14px; text-align: left; }
.menu-pop button:hover, .menu-pop a:hover { background: var(--sunk); text-decoration: none; }
.menu-pop .danger { color: var(--bad); }
.main { min-width: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding: 0 32px; }
main.wrap { padding-top: 28px; padding-bottom: 96px; }
.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.pagehead h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.022em; line-height: 1.2; }
.pagehead p { margin: 4px 0 0; color: var(--ink-2); font-size: 14px; }
header.top { display: none; }

/* ---- "Right now": the one loud element ---- */
.now { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 36px; align-items: end; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px 22px 16px; margin-bottom: 18px; }
.now .nums { display: flex; gap: 30px; }
.now .num span { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 2px; }
.now .num b { font-size: 34px; font-weight: 650; letter-spacing: -.03em; line-height: 1; }
.now .num b small { font-size: 15px; font-weight: 500; color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }
.now svg.flow { width: 100%; height: 72px; display: block; stroke: none; border-bottom: 1px solid var(--line-2); }
.now .legend { grid-column: 1 / -1; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); padding-top: 2px; }
.now .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: 0; }

/* ---- old status strip (kept for compatibility, hidden by layout) ---- */
.status { display: none; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); display: inline-block; flex: none; }
.dot.on { background: var(--signal); }
.dot.bad { background: var(--bad); }

/* ---- sections and panels ---- */
h2 { font-size: 15px; font-weight: 650; letter-spacing: -.01em; color: var(--ink); margin: 32px 0 10px; display: flex; align-items: baseline; gap: 8px; }
h2 .count { color: var(--ink-3); font-weight: 500; font-size: 14px; }
#view > h2:first-child { margin-top: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.card + .card { margin-top: 12px; }
.card-h { display: flex; align-items: flex-start; gap: 16px; padding: 18px 20px; }
.card-h h3 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
.card-h p { margin: 3px 0 0; font-size: 13.5px; color: var(--ink-2); max-width: 68ch; }
.card-h .sw { margin-top: 2px; }
.card-b { padding: 2px 20px 16px; border-top: 1px solid var(--line); }
.card-f { display: flex; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid var(--line); background: var(--panel-2); border-radius: 0 0 var(--r) var(--r); }
.note { font-size: 13px; color: var(--ink-2); padding: 12px 20px; border-top: 1px solid var(--line); }

/* ---- forms ---- */
.field { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 4px 24px; align-items: center; padding: 14px 0; }
.field + .field { border-top: 1px solid var(--line); }
.field > label { color: var(--ink); font-size: 14px; font-weight: 500; }
.field .help { grid-column: 2; font-size: 13px; color: var(--ink-2); max-width: 64ch; }
.input { display: flex; align-items: center; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r-sm); height: 38px; padding: 0 4px 0 12px; min-width: 0; max-width: 420px; transition: border-color .12s, box-shadow .12s; }
.input:focus-within { border-color: var(--signal); box-shadow: 0 0 0 3px var(--signal-soft); }
.input input, .input select { flex: 1; min-width: 0; border: 0; background: none; outline: none; height: 100%; }
.input .unit { color: var(--ink-2); font-size: 13px; padding: 0 8px; }
.input .iconbtn { width: 30px; height: 30px; }
.input.short { max-width: 170px; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; color: var(--ink-2); padding: 6px 12px; border-radius: 7px; font-size: 13.5px; font-weight: 500; transition: transform 160ms var(--ease-out); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0, 0, 0, .08); }
.seg button .n { color: var(--ink-3); margin-left: 6px; font-weight: 500; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--panel); color: var(--ink); font-weight: 600; font-size: 13.5px; white-space: nowrap; transition: transform 160ms var(--ease-out), background-color 120ms ease, border-color 120ms ease; }
.btn:active:not(:disabled), .iconbtn:active, nav.tabs button:active, .seg button:active, .linkbtn:active { transform: scale(0.97); }
.btn:hover { background: var(--sunk); }
.btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); }
.btn.primary:hover { filter: brightness(1.06); background: var(--signal); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); border-color: var(--bad-soft); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { height: 30px; padding: 0 11px; font-size: 13px; border-radius: 7px; }

/* ---- switch ---- */
.sw { position: relative; display: inline-block; width: 38px; height: 22px; flex: none; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.sw span { position: absolute; inset: 0; background: var(--line-2); border-radius: 99px; transition: background-color 160ms ease; }
.sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform 160ms var(--ease-out); }
.sw input:checked + span { background: var(--signal); }
.sw input:checked + span::after { transform: translateX(16px); }
.sw input:focus-visible + span { box-shadow: 0 0 0 3px var(--signal-soft); }
.sw input:disabled + span { opacity: .45; }

/* ---- device table ---- */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pagehead .toolbar { flex-wrap: nowrap; flex: 0 1 auto; }
.pagehead .seg { flex-wrap: nowrap; }
@media (max-width: 1180px) { .pagehead .toolbar { flex-wrap: wrap; } }
.search { flex: 0 1 280px; max-width: none; }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
.thead, .row.dev { display: grid; grid-template-columns: 34px minmax(170px, 1.7fr) 92px minmax(150px, 1.25fr) 128px 108px 16px; gap: 14px; align-items: center; }
.thead { padding: 9px 16px; font-size: 12.5px; color: var(--ink-3); font-weight: 500; background: var(--panel-2); border-bottom: 1px solid var(--line); }
.thead .r { text-align: right; }
.row.dev .meta.m { display: none; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 16px; border-top: 1px solid var(--line); }
.row:first-child, .thead + .row { border-top: 0; }
.row.click { cursor: pointer; }
.row.click:hover { background: var(--panel-2); }
.row.open { background: var(--panel-2); }
.av { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: var(--sunk); color: var(--ink-2); position: relative; }
.av svg { width: 17px; height: 17px; }
.av .dot { position: absolute; right: -2px; bottom: -2px; border: 2px solid var(--panel); width: 10px; height: 10px; }
.row.open .av .dot, .row.click:hover .av .dot { border-color: var(--panel-2); }
.nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; min-width: 0; }
.nm > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.meta { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
.cell { font-size: 13.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cell.r { text-align: right; }
.cell b { color: var(--ink); font-weight: 600; }
.netpill { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 500; color: var(--ink); }
.netpill::before { content: ""; width: 7px; height: 7px; border-radius: 2px; background: var(--home); }
.netpill.guest::before { background: var(--guest); }
.netpill.iot::before { background: var(--iot); }
.tag { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 5px; background: var(--sunk); color: var(--ink-2); flex: none; line-height: 18px; }
.tag.iot { color: var(--iot); background: var(--iot-soft); }
.tag.guest { color: var(--guest); background: var(--guest-soft); }
.tag.blocked { color: var(--bad); background: var(--bad-soft); }
.tag.you { color: var(--signal); background: var(--signal-soft); }
.tag.cap { color: var(--ink); background: var(--sunk); box-shadow: inset 0 0 0 1px var(--line-2); }
.tag.no { color: var(--warn); background: var(--warn-soft); }
.grouph { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 22px 2px 8px; }
.linkbtn { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; padding: 4px 0; }
.linkbtn .chev { width: 15px; height: 15px; color: var(--ink-3); transition: transform 160ms var(--ease-out); }
.linkbtn .chev.up { transform: rotate(90deg); }
.linkbtn .count { margin-left: 2px; color: var(--ink-3); font-weight: 500; }
.field > .seg { justify-self: start; }
.ubar { height: 4px; border-radius: 2px; background: var(--sunk); margin-top: 7px; max-width: 420px; }
.ubar i { display: block; height: 100%; border-radius: 2px; background: var(--signal); }
.rangerow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.rangerow .input.short { max-width: 140px; }
.hostrow { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.hostrow .input { flex: 1 1 0; }
.acadd { display: flex; gap: 10px; flex-wrap: wrap; padding: 10px 0 2px; }
.addmac { border-top: 1px solid var(--line); padding-top: 12px; }
.addmac summary { cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--signal); width: max-content; }
.acadd .input { flex: 1 1 180px; }
.capform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.capform .input { height: 34px; max-width: 150px; }
.offline .nm, .offline .av, .offline .cell { opacity: .6; }
.right { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 13px; }
.chev { color: var(--ink-3); transition: transform 160ms var(--ease-out); }
.row.open .chev { transform: rotate(90deg); }
.detail { padding: 6px 16px 18px 64px; background: var(--panel-2); border-top: 1px solid var(--line); }
.detail .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 0 6px; }
.detail .togg { display: flex; align-items: center; gap: 10px; font-size: 13.5px; margin-right: 12px; }
.rename { display: flex; gap: 8px; margin: 8px 0 12px; }
.rename .input { flex: 1; height: 34px; }
.rate { font-size: 13px; color: var(--ink-2); text-align: right; line-height: 1.35; white-space: nowrap; }
.rate b { color: var(--ink); font-weight: 600; }
.panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin: 8px 0 0; }
.pane.wide { grid-column: 1 / -1; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.pane h4 { margin: 0 0 10px; font-size: 13px; font-weight: 650; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 7px 16px; font-size: 13px; align-items: baseline; }
.kv.two { grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); column-gap: 20px; }
.kv > span { color: var(--ink-2); white-space: nowrap; }
.kv b .nw { white-space: nowrap; }
.kv b { font-weight: 550; text-align: right; overflow-wrap: anywhere; min-width: 0; }
.kv b .mono { word-break: break-all; }
.live { display: flex; gap: 24px; align-items: baseline; margin-bottom: 6px; }
.live div span { display: block; font-size: 12px; color: var(--ink-2); }
.live div b { font-size: 21px; font-weight: 650; letter-spacing: -.02em; }
.spark { width: 100%; height: 54px; display: block; }
.bars { display: inline-flex; gap: 2px; align-items: flex-end; height: 12px; margin-left: 6px; vertical-align: -1px; }
.bars i { width: 3px; background: var(--line-2); border-radius: 1px; }
.bars i.on { background: var(--signal); }
.ctable { width: 100%; border-collapse: collapse; font-size: 13px; }
.ctable th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12.5px; padding: 0 10px 8px 0; white-space: nowrap; }
.ctable td { padding: 7px 10px 7px 0; border-top: 1px solid var(--line); vertical-align: top; }
.ctable td.num, .ctable th.num { text-align: right; white-space: nowrap; }
.ctable td .mono { word-break: break-all; }
.ctable .svc { font-weight: 600; }
.ctable .sub { color: var(--ink-3); font-size: 12px; }
.cwrap { max-height: 420px; overflow: auto; }
.pane h4 .btn { margin-left: auto; }
.empty { padding: 36px 16px; text-align: center; color: var(--ink-2); font-size: 14px; }
.sk { height: 58px; border-top: 1px solid var(--line); position: relative; overflow: hidden; }
.sk:first-child { border-top: 0; }
.sk::after { content: ""; position: absolute; left: 16px; top: 12px; width: 34px; height: 34px; border-radius: 9px; background: var(--sunk); }
.sk::before { content: ""; position: absolute; left: 64px; top: 16px; height: 10px; width: 32%; border-radius: 5px; background: var(--sunk); box-shadow: 0 16px 0 0 var(--sunk); }

/* ---- Wi-Fi networks ---- */
.nets { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 12px; align-items: start; }
.nets .card + .card { margin-top: 0; }
.net { padding: 18px 20px; }
.net .t { display: flex; align-items: center; gap: 10px; }
.net .t svg { color: var(--ink-2); }
.net .t b { font-size: 15.5px; font-weight: 650; }
.net .band { font-size: 13px; color: var(--ink-2); margin: 2px 0 14px; }
.pw { display: flex; align-items: center; gap: 2px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 3px 3px 3px 12px; }
.pw code { flex: 1; font-family: var(--font); font-size: 14px; letter-spacing: .02em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qr { display: grid; place-items: center; margin-top: 12px; padding: 14px; background: #fff; border-radius: var(--r-sm); border: 1px solid var(--line); }
.off-net { opacity: .6; }

/* ---- login ---- */

  const tab = S.tab;
  try { await Promise.all(NEEDS[tab].map(f => f())); if (tab === S.tab) render(); }
  catch (e) { if (!quiet || e instanceof AuthError) fail(e); }
}
let timer = null;
function startPolling() {
  clearInterval(timer);
  timer = setInterval(() => {
    // Internet page: only the "Now ..." line of the automatic limit moves; a full
    // refresh would fight with what is being typed.
    if (S.tab === "internet" && !document.hidden && API.has() && S.shaping && S.shaping.auto === "on") {
      iot("shaping").then(w => { ["now_down", "now_up", "now_extra", "now_ceil_down", "now_ceil_up"].forEach(k => { S.shaping[k] = w[k]; }); const el = $id("w-now"); if (el) el.innerHTML = autoNow(S.shaping); }).catch(() => {});
    }
    if (document.hidden || !API.has() || S.editing || S.capEdit || S.tab === "networks" || S.tab === "internet" || Object.keys(S.dirty).length) return;
    refresh(true);

}
window.addEventListener("hashchange", () => { if (!API.has()) return; const r = route(location.hash); go(r.tab, r.net); });

  $id("app").innerHTML = `<div class="login"><form id="lf" autocomplete="on">
    <div class="brand"><span class="mark">${ic("wifi")}</span><div>${esc(OWNER)}'s network<small>Archer AX10</small></div></div><p>Sign in with the router password.</p>
    <input type="text" name="username" value="admin" autocomplete="username" hidden>
    <div class="input"><input id="pw" type="password" placeholder="Router password" autocomplete="current-password" required>
      <button type="button" class="iconbtn" id="pwv" aria-label="Show password">${ic("eye")}</button></div>
    <button class="btn primary" id="lb">Log in</button>
    <div class="err" id="le">${esc(msg || "")}</div>
    <div class="alt">Need everything? <a href="${FULL}">Open the TP-Link settings</a></div>
  </form></div>`;
  const pw = $id("pw"); pw.focus();
  $id("pwv").onclick = () => { pw.type = pw.type === "password" ? "text" : "password"; };

      } else if (e instanceof TypeError) $id("le").textContent = "Can't reach the router.";
      else $id("le").textContent = "Login failed. Try again.";
      pw.select();
    }
  };
}

// Router and internet state, in the sidebar (and a dot on phones).

const pageHead = (title, sub, right) => `<div class="pagehead"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>${right || ""}</div>`;
function go(tab, net) {
  net = net || (tab === "networks" ? S.net : undefined);
  if (S.tab === tab && (!net || S.net === net)) return;
  S.tab = tab; if (net) S.net = net;
  S.open = null; S.editing = null; S.qr = null; S.conns = null; watchConns(); watchDetail();
  const h = "#" + tab + (tab === "networks" ? "/" + S.net : "");
  if (location.hash !== h) history.pushState(null, "", h);

async function reboot() {
  if (!await confirmBox("Reboot the router?", "Everything goes offline for about two minutes, then reconnects by itself.", "Reboot", true)) return;
  try { await API.call("/admin/system?form=reboot", { operation: "write" }); } catch (e) { if (!(e instanceof AuthError)) return fail(e); }
  clearInterval(timer);
  $id("app").innerHTML = `<div class="login"><div><div class="busy"><span class="spin"></span><b>Rebooting…</b></div>
    <p class="muted" style="margin-top:10px">This page reloads when the router is back.</p></div></div>`;
  const t0 = Date.now();
  const ping = async () => {
    try { const r = await fetch("/?" + Date.now(), { cache: "no-store" }); if (r.ok && Date.now() - t0 > 40000) return location.reload(); } catch (x) {}
    setTimeout(ping, 4000);
  };
  setTimeout(ping, 20000);
}
async function logout() {
  try { await API.call("/admin/system?form=logout", { operation: "write" }); } catch (e) {}
  API.forget(); showLogin("Logged out.");
}

const skel = n => `<div class="list">${'<div class="sk"></div>'.repeat(n)}</div>`;

// The live traffic band: totals now, and a stacked graph by network.
const NETS = [["home", "Home"], ["guest", "Guest"], ["iot", "IoT"]];

  const big = v => { if (v == null) return "–"; const t = fmtRate(v).split(" "); return `${t[0]}<small>${t[1]}</small>`; };
  const W = 600, H = 64, n = 36, max = Math.max(1e5, ...F.map(f => f.home + f.guest + f.iot));
  const x = i => (W * i) / Math.max(1, F.length - 1), y = v => H - (v / max) * (H - 4);

      const top = F.map((f, i) => base[i] + f[k]);

      paths += `<path d="${d}" style="fill:var(--${k})" opacity="${k === "home" ? .85 : .9}"/>`;

  const legend = NETS.map(([k, l]) => `<span><i style="background:var(--${k})"></i>${l} ${last ? fmtRate(last[k]) : "–"}</span>`).join("")

// The devices matching the current filter and search: what the list shows, and

function shownDevices() {

// Online devices first; offline ones folded away (shown while searching), with a

  const offHead = off.length ? `<div class="grouph">${searching ? `<span class="linkbtn" style="cursor:default">Offline<span class="count">${off.length}</span></span>`

// The nerdy part: polled every 2 s while a device is open (iot_net form "client").
function sparkline(hist) {

  const W = 300, H = 54, max = Math.max(1e5, ...hist.map(h => Math.max(h.down, h.up)));
  const pts = k => hist.map((h, i) => `${(i / (hist.length - 1) * W).toFixed(1)},${(H - 3 - h[k] / max * (H - 8)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="Speed over the last minute">
    <polyline points="${pts("up")}" fill="none" stroke="#93c5fd" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
    <polyline points="${pts("down")}" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;

function modulation(n) {
  if (!n) return "";
  let m = /he mcs (\d+) Nss (\d+).*?bw(\d+).*?GI ([\d.]+us)/.exec(n);
  if (m) return `HE-MCS ${m[1]} · ${m[2]}SS · ${m[3]} MHz · ${m[4].replace("us", " µs")} GI`;
  m = /vht mcs (\d+) Nss (\d+).*?bw(\d+)/.exec(n);
  if (m) return `VHT-MCS ${m[1]} · ${m[2]}SS · ${m[3]} MHz`;
  m = /mcs index (\d+)/.exec(n);

}
// conntrack prints IPv6 zero-padded; show the usual short form.
function shortIp(a) {
  if (!a || a.indexOf(":") < 0) return a;
  const g = a.split(":").map(x => x.replace(/^0+(?=.)/, ""));
  let best = -1, len = 0;
  for (let i = 0; i < g.length; i++) { let j = i; while (j < g.length && g[j] === "0") j++; if (j - i > len && j - i > 1) { best = i; len = j - i; } i = Math.max(i, j - 1); }

  return (g.slice(0, best).join(":") + "::" + g.slice(best + len).join(":")).replace(/^:::/, "::");
}
// What a port usually is. Only a guess: apps can use any port.
function service(c) {
  const p = c.rport, u = c.p === "udp", in_ = (a, b) => p >= a && p <= b;
  if (c.p === "icmp" || c.p === "ipv6-icmp" || c.icmp != null) return "Ping (ICMP)";
  if (p === 443) return u ? "QUIC (HTTP/3)" : "HTTPS";
  if (p === 80) return "HTTP";
  if (p === 53) return "DNS";
  if (p === 853) return "DNS over TLS";
  if (p === 123) return "Time (NTP)";
  if (in_(19302, 19309)) return "Google Meet";
  if (in_(8801, 8810)) return "Zoom";

  if (in_(50000, 50059) && u) return "Microsoft Teams";

  if (p === 5223) return "Apple push";

const findDev = mac => S.devices && S.devices.list.find(d => d.mac === mac);

    if (field !== "name") toast(({ internet: value ? "Internet on" : "Internet off", fast: value ? "Full speed on" : "Guest limit applies again", allowed: value ? "Can reach IoT devices" : "Can no longer reach IoT devices" })[field] + " · " + devName(d));
  } catch (e) { d[field] = before; render(); fail(e); }
}
async function setBlocked(mac, on) {
  const d = findDev(mac), D = S.devices; if (!d) return;
  if (on && !await confirmBox(`Block ${devName(d)}?`, "It is disconnected now and can't rejoin. If it uses a private (random) address, it can come back with a new one; changing the Wi-Fi password is the lasting fix.", "Block", true)) return;
  S.busy[mac] = true; render();
  const dashed = mac.replace(/:/g, "-");
  try {
    if (on) {
      if (D.block.mode !== "black") await API.call("/admin/access_control?form=mode", { operation: "write", access_mode: "black" });
      if (D.block.enable !== "on") await API.call("/admin/access_control?form=enable", { operation: "write", enable: "on" });
      if (!d.listed) await API.call("/admin/access_control?form=black_list", { operation: "insert", key: "add", old: "add", index: 0, new: JSON.stringify({ name: devName(d).slice(0, 32), mac: dashed }) });
    } else {
      const list = (await API.call("/admin/access_control?form=black_list", { operation: "load" })).data || [];
      const idx = Array.isArray(list) ? list.findIndex(x => (x.mac || "").toUpperCase() === dashed) : -1;
      if (idx < 0) throw new ApiError("not in the block list");

}

/* home allow list (ax10.sh home_sync) */
const MESH_RE = /archer|deco|tp-?link|mesh|extender|repeater/i;

async function acBusy(fn) {

const homeAllow = (mac, op, name) => iot("home_allow", Object.assign({ operation: "write", mac, op }, name ? { name } : {}));
function acAllow(mac, name) {

}
async function acRemove(mac) {

  if (d && d.this) return toast("That's the device you're using; removing it would lock you out.", true);
  if (D.allowOn && D.white.length <= 1) return toast("That's the last device on the list. Turn the allow list off instead.", true);
  const mesh = (D.white.find(w => w.mac === mac) || {}).mesh || meshUnits(D).some(m => m.mac === mac) || MESH_RE.test(nm);   // for the warning only
  if (!await confirmBox(`Remove ${nm}?`, (mesh ? "This looks like mesh or Wi-Fi equipment; removing it can take the satellite and everything on it offline. " : "")
    + (D.allowOn ? "It is disconnected now and can't rejoin the home network. The guest Wi-Fi still works for it." : "It won't be able to join once the allow list is on."), "Remove", true)) return;

async function setAllowList(on) {
  const D = S.devices; if (!D || !D.white) return;
  if (!on) {
    if (!await confirmBox("Turn the allow list off?", "Any device with the password can join the home network again. The list is kept for next time.", "Turn off")) return render();
    return acBusy(async () => { await iot("home", { operation: "write", lock: "off" }); toast("Allow list off"); });
  }
  // Never lock out the device in use or the mesh satellite: pin them first.
  const have = new Set(D.white.map(w => w.mac));
  const must = D.list.filter(d => d.this && !d.onWhite)
    .concat(D.home.mesh_macs.map(m => m.toUpperCase()).filter(m => !have.has(m)).map(m => ({ mac: m, name: "Mesh satellite" })));
  const out = D.list.filter(d => d.online && d.net === "home" && !d.onWhite && !d.this);
  const msg = [`Only the ${D.white.length + must.length} devices on the list can use the home network.`,
    must.length ? `${must.map(devName).join(", ")} ${must.length === 1 ? "is" : "are"} added first so you stay connected.` : "",
    out.length ? `${out.length} connected device${out.length === 1 ? " is" : "s are"} not on the list and will be cut off: ${out.map(devName).join(", ")}.` : ""].filter(Boolean).join(" ");
  if (!await confirmBox("Turn the allow list on?", msg, "Turn on")) return render();

async function forgetDevices(list) {
  if (!list.length) return;
  const one = list.length === 1, nm = one ? devName(list[0]) : `${list.length} devices`;
  const listed = list.filter(d => d.onWhite).length, online = list.filter(d => d.online).length;
  const text = [(one ? "Its" : "Their") + " name, speed cap and other settings are cleared.",
    listed ? (one ? "It is taken off the home allow list" : `${listed} of them are taken off the home allow list`) + (online && S.devices.allowOn ? ", so it is disconnected from the home network now." : ".") : "",
    list.some(d => d.pinned) ? "An IoT device loses its fixed address and has to be let in again." : "",
    online ? "It stays on this list while it is connected." : (one ? "It leaves this list, and comes back if it reconnects." : "They leave this list, and come back if they reconnect.")].filter(Boolean).join(" ");
  if (!await confirmBox(`Forget ${nm}?`, text, "Forget", true)) return;
  list.forEach(d => { S.busy[d.mac] = true; }); render();
  let done = 0;
  try {
    for (let i = 0; i < list.length; i += 50) {          // the router takes at most 64 at a time
      const part = list.slice(i, i + 50);
      await iot("device", { operation: "write", forget: part.map(d => d.mac).join(",") });
      done += part.length;
    }
    toast(`Forgot ${nm}`);
  } catch (e) {
    if (e instanceof AuthError) fail(e);
    else toast(done ? `Forgot ${done} of ${list.length}; the rest failed. ${e.code || ""}` : `Nothing was forgotten. ${e.code && e.code !== "-1" ? e.code : ""}`, true);
  }
  if (list.some(d => d.mac === S.open)) { S.open = null; watchDetail(); }
  list.forEach(d => { delete S.busy[d.mac]; });
  await new Promise(r => setTimeout(r, 800));
  try { await loadDevices(); } catch (e) { if (e instanceof AuthError) fail(e); }
  render();
}

async function setLock(on) {

    S.iot = await iot("settings", Object.assign({ operation: "write" }, S.iot, { lock: on ? "on" : "off" })); S.iotLoadedAt = Date.now();

function readIotForm() {

function readWanForm() {

  return { enable: $id("w-enable").checked ? "on" : "off", down: $id("w-down").value.trim(), up: $id("w-up").value.trim(), prio: $id("w-prio").checked ? "on" : "off", guest_low: $id("w-glow").checked ? "on" : "off",
           auto: $id("w-auto").dataset.v, min_down: v("w-min-d", "min_down"), max_down: v("w-max-d", "max_down"), min_up: v("w-min-u", "min_up"), max_up: v("w-max-u", "max_up") };

async function saveWan() {

  const rng = ["min_down", "max_down", "min_up", "max_up"].map(k => f[k]);
  if (rng.some(v => v !== "" && !(/^\d+$/.test(v) && +v >= 1 && +v <= 1000))) return toast("The lowest and highest speeds are whole Mbps from 1 to 1000, or empty.", true);
  if ((f.min_down && +f.min_down > d) || (f.max_down && +f.max_down < d) || (f.min_up && +f.min_up > u) || (f.max_up && +f.max_up < u)) return toast("The usual speed has to lie between the lowest and the highest.", true);
  const send = { operation: "write" }; ["enable", "down", "up", "prio", "guest_low", "auto", "min_down", "max_down", "min_up", "max_up"].forEach(k => { send[k] = f[k]; });
  try { S.shaping = await iot("shaping", send); delete S.dirty.wan; render();
    toast(f.enable !== "on" ? "Whole-connection limit off" : (f.auto === "on" ? `Automatic limit on, starting at ${d}↓ ${u}↑ Mbps` : `Whole connection capped at ${d}↓ ${u}↑ Mbps`) + (f.prio === "on" ? ", calls and games first" : "") + (f.guest_low === "on" ? ", guests last" : "")); }
  catch (e) { fail(e); }
}
async function saveGuest() {
  const f = S.dirty.guest; if (!f) return;
  const d = +f.down, u = +f.up;
  if (f.enable === "on" && !(d >= 1 && d <= 1000 && u >= 1 && u <= 1000)) return toast("Speeds must be between 1 and 1000 Mbps.", true);
  try { S.guest = await iot("guest_settings", Object.assign({ operation: "write" }, f)); delete S.dirty.guest; await loadDevices(); render(); toast("Guest limit saved"); }
  catch (e) { fail(e); }
}

/* ------------------------------------------------------------------ start */
function boot() { shell(); render(); refresh(); startPolling(); }
if (typeof jQuery === "undefined" || !jQuery.encrypt) {
  $id("app").innerHTML = `<div class="login"><div><b>Couldn't load the router's scripts.</b><p class="muted">Try reloading, or <a href="${FULL}">open the TP-Link settings</a>.</p></div></div>`;
} else if (API.restore()) boot(); else showLogin();
</script>
</body>
